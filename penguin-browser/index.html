<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src https: http:; frame-src https: http:;">
  <title>Penguin Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand"><div class="brand-mark">🐧</div><span>Penguin</span><small>BROWSER</small></div>
    <div class="window-caption">A little more freedom on the web</div>
    <div class="title-actions" aria-hidden="true"><span class="linux-dot"></span><span class="linux-dot"></span><span class="linux-dot close"></span></div>
  </header>

  <nav class="tabbar" aria-label="Browser tabs">
    <div id="tabs" class="tabs"></div>
    <button id="newTab" class="new-tab" title="New tab" aria-label="New tab">＋</button>
  </nav>

  <section class="toolbar" aria-label="Browser controls">
    <div class="nav-buttons">
      <button id="back" class="tool-btn" title="Back" aria-label="Back" disabled>←</button>
      <button id="forward" class="tool-btn" title="Forward" aria-label="Forward" disabled>→</button>
      <button id="reload" class="tool-btn" title="Reload" aria-label="Reload">↻</button>
      <button id="home" class="tool-btn" title="Home" aria-label="Home">⌂</button>
    </div>
    <form id="addressForm" class="address-form">
      <span class="lock" id="securityIcon">⌕</span>
      <input id="address" autocomplete="off" spellcheck="false" placeholder="Search or enter a website address" aria-label="Address or search">
      <button type="button" id="bookmark" class="address-star" title="Bookmark this page" aria-label="Bookmark this page">☆</button>
    </form>
    <div class="toolbar-actions">
      <button id="bookmarks" class="tool-btn" title="Bookmarks" aria-label="Bookmarks">★</button>
      <button id="downloads" class="tool-btn" title="Downloads" aria-label="Downloads">↓</button>
      <button id="history" class="tool-btn" title="History" aria-label="History">◷</button>
      <button id="settings" class="tool-btn" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </section>

  <main id="browserArea">
    <section id="homePage" class="home-page">
      <div class="home-glow"></div>
      <div class="home-content">
        <div class="hero-penguin">🐧</div>
        <p class="eyebrow">WELCOME TO YOUR NEW WEB HOME</p>
        <h1>Browse beyond<br><span>the ordinary.</span></h1>
        <p class="hero-copy">A browser with a Linux spirit: open, personal, and yours to shape.</p>
        <form id="homeSearch" class="home-search">
          <span>⌕</span>
          <input id="homeQuery" placeholder="Search the web or type a URL" autocomplete="off" aria-label="Search the web">
          <button type="submit">Go <b>→</b></button>
        </form>
        <div class="quick-links">
          <button data-url="https://www.wikipedia.org"><span>W</span>Wikipedia</button>
          <button data-url="https://github.com"><span>⌘</span>GitHub</button>
          <button data-url="https://www.mozilla.org"><span>火</span>Mozilla</button>
          <button data-url="https://www.kernel.org"><span>🐧</span>Linux</button>
        </div>
        <div class="home-foot">OPEN SOURCE SPIRIT <i>•</i> BUILT FOR EXPLORING</div>
      </div>
    </section>
    <div id="webviews"></div>
    <section id="panel" class="panel hidden" aria-label="Browser panel">
      <div class="panel-head"><h2 id="panelTitle">Panel</h2><button id="closePanel" class="tool-btn" aria-label="Close panel">✕</button></div>
      <div id="panelContent" class="panel-content"></div>
    </section>
  </main>
  <footer class="statusbar"><span><i class="status-led"></i><span id="statusText">Ready to explore</span></span><span>Penguin Browser <b>1.0</b></span></footer>
  <script src="renderer.js"></script>
</body>
</html>
